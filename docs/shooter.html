<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="images/logoeddie.jpg">
    <link rel="apple-touch-icon" href="images/logoeddie.jpg">
    <meta name="theme-color" content="#1a1f24">
    <title>Aether Shooter - Steampunk Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --slate-bg: #1a1f24;
            --slate-surface: #222831;
            --copper: #c87f4c;
            --bronze: #b08d6a;
            --neon-amber: #ffb703;
            --neon-cyan: #00f0ff;
            --text-main: #e2e8f0;
            --shadow-dark: rgba(0,0,0,0.6);
            --shadow-light: rgba(255,255,255,0.05);
            --neo-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            --neo-inset: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #0f1115;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(200, 127, 76, 0.05), transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(255, 183, 3, 0.05), transparent 40%);
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 90vh;
            max-height: 1000px;
            background-color: var(--slate-bg);
            border-radius: 20px;
            box-shadow: var(--neo-shadow);
            border: 2px solid rgba(200, 127, 76, 0.3);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }

        .hud-panel {
            background: rgba(34, 40, 49, 0.8);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: var(--neo-shadow);
            border: 1px solid rgba(255,255,255,0.05);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            color: var(--copper);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 120px;
        }

        .hud-value {
            font-size: 1.5rem;
            color: var(--neon-amber);
            text-shadow: 0 0 10px rgba(255, 183, 3, 0.5);
        }

        /* Health Bar */
        #health-container {
            width: 200px;
            height: 20px;
            background: var(--slate-surface);
            border-radius: 10px;
            box-shadow: var(--neo-inset);
            border: 1px solid rgba(0,0,0,0.5);
            overflow: hidden;
            margin-top: 5px;
        }
        
        #health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff0055, var(--neon-amber));
            transition: width 0.2s ease-out;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
        }

        /* Overlay Screens */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 17, 21, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .overlay h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.5rem;
            color: var(--text-main);
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 0 0 20px rgba(200, 127, 76, 0.5);
        }
        .overlay h1 span { color: var(--copper); }

        .overlay p {
            color: var(--bronze);
            font-size: 1.2rem;
            margin-bottom: 40px;
            text-align: center;
            max-width: 80%;
        }

        .neo-btn {
            background: var(--slate-surface);
            color: var(--neon-amber);
            border: 2px solid var(--copper);
            padding: 15px 40px;
            border-radius: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--neo-shadow);
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .neo-btn:hover {
            background: var(--copper);
            color: var(--slate-bg);
            box-shadow: 0 0 20px rgba(200, 127, 76, 0.6);
            transform: translateY(-3px);
        }

        .neo-btn:active {
            transform: translateY(0);
            box-shadow: var(--neo-inset);
        }

        /* Back Link */
        .back-link {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        .back-link a {
            color: var(--bronze);
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            padding: 8px 16px;
            background: var(--slate-surface);
            border-radius: 20px;
            box-shadow: var(--neo-shadow);
        }
        .back-link a:hover { color: var(--neon-cyan); }
        
        .hidden { display: none !important; }

        /* Boss Warning */
        #boss-warning {
            position: absolute;
            top: 30%;
            width: 100%;
            text-align: center;
            color: #ff0055;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
            opacity: 0;
            pointer-events: none;
            z-index: 15;
            transition: opacity 0.5s;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="hud" class="hidden">
            <div class="hud-panel">
                <span>GOLF</span>
                <span id="wave-val" class="hud-value">1</span>
            </div>
            <div class="hud-panel" style="flex-grow: 1; margin: 0 20px;">
                <span>ROMP INTEGRITEIT</span>
                <div id="health-container"><div id="health-bar"></div></div>
            </div>
            <div class="hud-panel">
                <span>SCORE</span>
                <span id="score-val" class="hud-value">0</span>
            </div>
        </div>

        <div id="boss-warning">⚠️ BOSS INBOUND ⚠️</div>

        <div id="start-screen" class="overlay">
            <h1>AETHER <span>SHOOTER</span></h1>
            <p>Bestuur een stoom-aangedreven luchtschip. Vernietig de mechanische zwerm.<br><br><b>Pijltjestoetsen / WASD</b>: Navigeren<br><b>Spatie</b>: Vuren</p>
            <button id="start-btn" class="neo-btn">ENGAGE</button>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <h1>SYSTEEM <span>FALEN</span></h1>
            <p>De romp is gebroken.</p>
            <div style="font-family: 'Space Grotesk'; font-size: 1.5rem; color: var(--neon-amber); margin-bottom: 30px;">
                Eindscore: <span id="final-score">0</span><br>
                Bereikte Golf: <span id="final-wave">1</span>
            </div>
            <button id="restart-btn" class="neo-btn">REBOOT</button>
        </div>

        <div class="back-link">
            <a href="ai_apps.html">← Terug naar Hub</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        // UI Elements
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const scoreEl = document.getElementById('score-val');
        const waveEl = document.getElementById('wave-val');
        const healthBar = document.getElementById('health-bar');
        const finalScoreEl = document.getElementById('final-score');
        const finalWaveEl = document.getElementById('final-wave');
        const bossWarning = document.getElementById('boss-warning');

        // Game State
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let wave = 1;
        let frameCount = 0;
        let lastTime = 0;
        
        // Juice Variables
        let shakeTime = 0;
        let shakeMagnitude = 0;

        // Entities
        let player;
        let projectiles = [];
        let enemies = [];
        let particles = [];
        let stars = [];

        // Keys
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false, " ": false };

        // Colors
        const COLORS = {
            bg: '#1a1f24',
            copper: '#c87f4c',
            bronze: '#b08d6a',
            amber: '#ffb703',
            cyan: '#00f0ff',
            red: '#ff0055',
            enemy: '#4a4e69'
        };

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            initStars();
        }
        window.addEventListener('resize', resize);

        // Input Handling
        window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        class Player {
            constructor() {
                this.width = 40;
                this.height = 50;
                this.x = canvas.width / 2;
                this.y = canvas.height - 100;
                this.speed = 400; // pixels per second
                this.hp = 100;
                this.maxHp = 100;
                this.cooldown = 0;
                this.fireRate = 0.15; // seconds
            }

            update(dt) {
                // Movement
                let dx = 0, dy = 0;
                if (keys.w || keys.ArrowUp) dy -= 1;
                if (keys.s || keys.ArrowDown) dy += 1;
                if (keys.a || keys.ArrowLeft) dx -= 1;
                if (keys.d || keys.ArrowRight) dx += 1;

                // Normalize diagonal movement
                if (dx !== 0 && dy !== 0) {
                    const length = Math.sqrt(dx*dx + dy*dy);
                    dx /= length; dy /= length;
                }

                this.x += dx * this.speed * dt;
                this.y += dy * this.speed * dt;

                // Boundaries
                this.x = Math.max(this.width/2, Math.min(canvas.width - this.width/2, this.x));
                this.y = Math.max(this.height/2, Math.min(canvas.height - this.height/2, this.y));

                // Shooting
                this.cooldown -= dt;
                if (keys[" "] && this.cooldown <= 0) {
                    this.shoot();
                    this.cooldown = this.fireRate;
                }
            }

            shoot() {
                projectiles.push(new Projectile(this.x, this.y - this.height/2, -800, COLORS.amber, true));
                // Recoil particle
                createParticles(this.x, this.y + this.height/2, COLORS.cyan, 2, 50);
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Steampunk Ship Design
                
                // Exhaust glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = COLORS.cyan;
                ctx.fillStyle = COLORS.cyan;
                ctx.beginPath();
                ctx.arc(0, this.height/2 + Math.random()*5, this.width/4, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Main Hull (Bronze)
                ctx.fillStyle = COLORS.bronze;
                ctx.beginPath();
                ctx.moveTo(0, -this.height/2);
                ctx.lineTo(this.width/2, this.height/4);
                ctx.lineTo(this.width/3, this.height/2);
                ctx.lineTo(-this.width/3, this.height/2);
                ctx.lineTo(-this.width/2, this.height/4);
                ctx.closePath();
                ctx.fill();

                // Copper Engine / Gear
                ctx.strokeStyle = COLORS.copper;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, this.height/6, this.width/4, 0, Math.PI*2);
                ctx.stroke();
                
                // Cockpit
                ctx.fillStyle = COLORS.cyan;
                ctx.beginPath();
                ctx.ellipse(0, -this.height/6, this.width/8, this.height/6, 0, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
            }

            takeDamage(amount) {
                this.hp -= amount;
                healthBar.style.width = Math.max(0, (this.hp / this.maxHp) * 100) + '%';
                triggerShake(0.3, 15);
                createParticles(this.x, this.y, COLORS.red, 15, 200);
                if (this.hp <= 0) {
                    endGame();
                }
            }
        }

        class Projectile {
            constructor(x, y, vy, color, isPlayer) {
                this.x = x; this.y = y;
                this.vy = vy;
                this.color = color;
                this.isPlayer = isPlayer;
                this.width = 4;
                this.height = 15;
                this.active = true;
            }

            update(dt) {
                this.y += this.vy * dt;
                if (this.y < -50 || this.y > canvas.height + 50) this.active = false;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                ctx.restore();
            }
        }

        class Enemy {
            constructor(type, waveFactor) {
                this.type = type; // 'drone', 'fighter', 'boss'
                this.active = true;
                
                if (type === 'boss') {
                    this.width = 150;
                    this.height = 80;
                    this.hp = 500 * waveFactor;
                    this.maxHp = this.hp;
                    this.scoreValue = 1000;
                    this.x = canvas.width / 2;
                    this.y = -100;
                    this.vx = 100;
                    this.vy = 50;
                    this.fireTimer = 0;
                } else if (type === 'fighter') {
                    this.width = 40;
                    this.height = 40;
                    this.hp = 30 * waveFactor;
                    this.scoreValue = 150;
                    this.x = Math.random() * (canvas.width - 60) + 30;
                    this.y = -50;
                    this.vy = 150 + Math.random() * 50;
                    this.vx = (Math.random() - 0.5) * 100;
                    this.fireTimer = Math.random() * 2;
                } else { // drone
                    this.width = 30;
                    this.height = 30;
                    this.hp = 10 * waveFactor;
                    this.scoreValue = 50;
                    this.x = Math.random() * (canvas.width - 60) + 30;
                    this.y = -50;
                    this.vy = 200 + Math.random() * 100 + (waveFactor * 20);
                    this.vx = Math.sin(this.y * 0.05) * 50;
                }
            }

            update(dt) {
                if (this.type === 'boss') {
                    if (this.y < 100) this.y += this.vy * dt;
                    else {
                        this.x += this.vx * dt;
                        if (this.x < this.width/2 || this.x > canvas.width - this.width/2) this.vx *= -1;
                    }
                    
                    this.fireTimer += dt;
                    if (this.fireTimer > 1.5) {
                        this.fireTimer = 0;
                        // Fire spread
                        projectiles.push(new Projectile(this.x - 40, this.y + this.height/2, 300, COLORS.red, false));
                        projectiles.push(new Projectile(this.x, this.y + this.height/2, 300, COLORS.red, false));
                        projectiles.push(new Projectile(this.x + 40, this.y + this.height/2, 300, COLORS.red, false));
                    }
                } else if (this.type === 'fighter') {
                    this.y += this.vy * dt;
                    this.x += this.vx * dt;
                    if (this.x < 20 || this.x > canvas.width - 20) this.vx *= -1;
                    
                    this.fireTimer += dt;
                    if (this.fireTimer > 2.0 && Math.abs(this.x - player.x) < 100) {
                        this.fireTimer = 0;
                        projectiles.push(new Projectile(this.x, this.y + this.height/2, 400, COLORS.red, false));
                    }
                } else { // drone
                    this.y += this.vy * dt;
                    this.x += Math.sin(this.y * 0.02) * 2; // Sine wave movement
                }

                if (this.y > canvas.height + 100) this.active = false;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                if (this.type === 'boss') {
                    ctx.fillStyle = '#2a1a1a';
                    ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                    ctx.strokeStyle = COLORS.copper;
                    ctx.lineWidth = 4;
                    ctx.strokeRect(-this.width/2, -this.height/2, this.width, this.height);
                    
                    // Rotating gears
                    ctx.rotate(frameCount * 0.05);
                    ctx.beginPath();
                    ctx.arc(-40, 0, 20, 0, Math.PI*2);
                    ctx.arc(40, 0, 20, 0, Math.PI*2);
                    ctx.stroke();
                    
                    // Health bar
                    ctx.rotate(-frameCount * 0.05);
                    ctx.fillStyle = 'rgba(255,0,0,0.5)';
                    ctx.fillRect(-this.width/2, -this.height/2 - 15, this.width, 5);
                    ctx.fillStyle = COLORS.red;
                    ctx.fillRect(-this.width/2, -this.height/2 - 15, this.width * (this.hp/this.maxHp), 5);
                    
                } else {
                    ctx.fillStyle = COLORS.enemy;
                    ctx.beginPath();
                    if (this.type === 'fighter') {
                        ctx.moveTo(0, this.height/2);
                        ctx.lineTo(this.width/2, -this.height/2);
                        ctx.lineTo(-this.width/2, -this.height/2);
                    } else {
                        ctx.arc(0, 0, this.width/2, 0, Math.PI*2);
                    }
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.strokeStyle = COLORS.bronze;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    // Eye
                    ctx.fillStyle = COLORS.red;
                    ctx.beginPath();
                    ctx.arc(0, 0, 4, 0, Math.PI*2);
                    ctx.fill();
                }
                
                ctx.restore();
            }

            takeDamage(amount) {
                this.hp -= amount;
                createParticles(this.x, this.y, COLORS.amber, 3, 100);
                if (this.hp <= 0) {
                    this.active = false;
                    score += this.scoreValue;
                    updateHUD();
                    triggerShake(0.1, 5);
                    createParticles(this.x, this.y, COLORS.copper, 20, 300);
                    createParticles(this.x, this.y, COLORS.red, 10, 200);
                }
            }
        }

        class Particle {
            constructor(x, y, color, speed) {
                this.x = x; this.y = y; this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const vel = Math.random() * speed;
                this.vx = Math.cos(angle) * vel;
                this.vy = Math.sin(angle) * vel;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.01;
                this.size = Math.random() * 4 + 1;
            }
            update(dt) {
                this.x += this.vx * dt * 60;
                this.y += this.vy * dt * 60;
                this.life -= this.decay;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1.0;
            }
        }

        function createParticles(x, y, color, count, speed) {
            for(let i=0; i<count; i++) particles.push(new Particle(x, y, color, speed));
        }

        function initStars() {
            stars = [];
            for(let i=0; i<100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: Math.random() * 100 + 20,
                    size: Math.random() * 2 + 0.5
                });
            }
        }

        function updateStars(dt) {
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            stars.forEach(s => {
                s.y += s.speed * dt;
                if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
                ctx.fillRect(s.x, s.y, s.size, s.size * 2);
            });
        }

        // Wave Manager
        let waveTimer = 0;
        let enemiesToSpawn = 0;
        let spawnInterval = 1;
        let timeSinceLastSpawn = 0;
        let bossActive = false;

        function startWave() {
            waveEl.innerText = wave;
            bossActive = (wave % 5 === 0);
            
            if (bossActive) {
                enemiesToSpawn = 1;
                bossWarning.style.opacity = 1;
                setTimeout(() => bossWarning.style.opacity = 0, 3000);
            } else {
                enemiesToSpawn = 5 + (wave * 3);
                spawnInterval = Math.max(0.2, 1.5 - (wave * 0.1));
            }
        }

        function updateWaveManager(dt) {
            if (enemiesToSpawn > 0 && !bossActive) {
                timeSinceLastSpawn += dt;
                if (timeSinceLastSpawn >= spawnInterval) {
                    timeSinceLastSpawn = 0;
                    enemiesToSpawn--;
                    
                    const type = Math.random() > 0.8 ? 'fighter' : 'drone';
                    enemies.push(new Enemy(type, 1 + (wave*0.1)));
                }
            } else if (enemiesToSpawn > 0 && bossActive) {
                enemiesToSpawn--;
                enemies.push(new Enemy('boss', wave/5));
            }
            
            // Check if wave complete
            if (enemiesToSpawn === 0 && enemies.length === 0) {
                waveTimer += dt;
                if (waveTimer > 3) {
                    wave++;
                    waveTimer = 0;
                    startWave();
                    // Heal player slightly
                    player.hp = Math.min(player.maxHp, player.hp + 20);
                    healthBar.style.width = (player.hp / player.maxHp * 100) + '%';
                }
            }
        }

        // Collision Check
        function checkCollisions() {
            // Player Projectiles vs Enemies
            projectiles.filter(p => p.isPlayer).forEach(p => {
                enemies.forEach(e => {
                    if (p.active && e.active && Math.abs(p.x - e.x) < e.width/2 + p.width/2 && Math.abs(p.y - e.y) < e.height/2 + p.height/2) {
                        p.active = false;
                        e.takeDamage(20);
                    }
                });
            });

            // Enemy Projectiles vs Player
            projectiles.filter(p => !p.isPlayer).forEach(p => {
                if (p.active && Math.abs(p.x - player.x) < player.width/2 && Math.abs(p.y - player.y) < player.height/2) {
                    p.active = false;
                    player.takeDamage(10);
                }
            });

            // Player vs Enemies
            enemies.forEach(e => {
                if (e.active && Math.abs(player.x - e.x) < (player.width + e.width)/2 * 0.8 && Math.abs(player.y - e.y) < (player.height + e.height)/2 * 0.8) {
                    e.takeDamage(100);
                    player.takeDamage(20);
                }
            });
        }

        function triggerShake(duration, magnitude) {
            shakeTime = duration;
            shakeMagnitude = magnitude;
        }

        function updateHUD() {
            scoreEl.innerText = score;
        }

        function startGame() {
            resize();
            gameState = 'PLAYING';
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            
            player = new Player();
            projectiles = [];
            enemies = [];
            particles = [];
            score = 0;
            wave = 1;
            waveTimer = 0;
            updateHUD();
            startWave();
            
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameState = 'GAMEOVER';
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            finalScoreEl.innerText = score;
            finalWaveEl.innerText = wave;
        }

        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') return;

            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            frameCount++;

            // Update
            player.update(dt);
            updateWaveManager(dt);
            
            projectiles.forEach(p => p.update(dt));
            enemies.forEach(e => e.update(dt));
            particles.forEach(p => p.update(dt));
            
            // Cleanup
            projectiles = projectiles.filter(p => p.active);
            enemies = enemies.filter(e => e.active);
            particles = particles.filter(p => p.life > 0);

            checkCollisions();

            // Draw
            ctx.save();
            updateStars(dt);

            // Screen Shake
            if (shakeTime > 0) {
                shakeTime -= dt;
                const dx = (Math.random() - 0.5) * shakeMagnitude;
                const dy = (Math.random() - 0.5) * shakeMagnitude;
                ctx.translate(dx, dy);
            }

            particles.forEach(p => p.draw(ctx));
            projectiles.forEach(p => p.draw(ctx));
            enemies.forEach(e => e.draw(ctx));
            player.draw(ctx);

            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        
        // Initial setup
        resize();
        updateStars(0);
        
    </script>
</body>
</html>
