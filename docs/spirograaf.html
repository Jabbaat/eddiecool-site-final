<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="images/logoeddie.jpg">
    <link rel="apple-touch-icon" href="images/logoeddie.jpg">
    <meta name="theme-color" content="#1a1f24">
    <title>Spirograaf 3D - Steampunk Neomorfisme</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --slate-bg: #1a1f24;
            --slate-surface: #222831;
            --copper-accent: #c87f4c;
            --bronze-muted: #b08d6a;
            --neon-amber: #ffb703;
            --neon-cyan: #00f0ff;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            
            --neo-shadow: 6px 6px 12px rgba(0,0,0,0.6), -6px -6px 12px rgba(255,255,255,0.02);
            --neo-inset: inset 4px 4px 8px rgba(0,0,0,0.6), inset -4px -4px 8px rgba(255,255,255,0.02);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--slate-bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            background-image: radial-gradient(circle at center, #222831 0%, #1a1f24 100%);
        }

        .main-container {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (min-width: 1024px) {
            .main-container { flex-direction: row; }
        }

        h1 {
            font-family: 'Courier Prime', monospace;
            color: var(--neon-amber);
            text-align: center;
            width: 100%;
            font-size: 2rem;
            margin: 10px 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 183, 3, 0.4);
        }

        .canvas-wrapper {
            flex: 1 1 65%;
            background: var(--slate-surface);
            border-radius: 16px;
            box-shadow: var(--neo-inset);
            border: 2px solid var(--bronze-muted);
            padding: 10px;
            position: relative;
        }

        #spiroContainer {
            width: 100%;
            height: 100%;
            min-height: 500px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .controls-wrapper {
            flex: 1 1 35%;
            background: var(--slate-surface);
            border-radius: 16px;
            box-shadow: var(--neo-shadow);
            border: 1px solid rgba(200, 127, 76, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 5px;
            border-bottom: 2px solid var(--bronze-muted);
            padding-bottom: 10px;
        }

        .tab {
            flex: 1;
            background: var(--slate-bg);
            color: var(--text-muted);
            border: none;
            padding: 10px 5px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier Prime', monospace;
            font-weight: bold;
            box-shadow: var(--neo-shadow);
            transition: all 0.3s;
        }

        .tab.active {
            background: var(--copper-accent);
            color: #1a1f24;
            box-shadow: var(--neo-inset);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* Control Sections */
        .control-section {
            background: rgba(0,0,0,0.15);
            padding: 15px;
            border-radius: 12px;
            box-shadow: var(--neo-inset);
        }

        h2 {
            font-family: 'Courier Prime', monospace;
            font-size: 1.1rem;
            color: var(--copper-accent);
            margin: 0 0 15px 0;
            border-bottom: 1px dashed var(--bronze-muted);
            padding-bottom: 5px;
        }

        /* Buttons */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .neo-btn {
            background: var(--slate-bg);
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier Prime', monospace;
            font-weight: bold;
            box-shadow: var(--neo-shadow);
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .neo-btn.active {
            color: var(--neon-cyan);
            box-shadow: var(--neo-inset);
            border-color: var(--neon-cyan);
            text-shadow: 0 0 5px var(--neon-cyan);
        }
        
        .neo-btn:hover:not(.active) {
            color: var(--neon-amber);
            box-shadow: 4px 4px 8px rgba(0,0,0,0.5), -4px -4px 8px rgba(255,255,255,0.03);
        }

        /* Sliders */
        .param-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }

        .param-label {
            flex: 0 0 120px;
            color: var(--text-main);
            font-weight: 600;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 10px;
            background: #111418;
            border-radius: 5px;
            box-shadow: var(--neo-inset);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 24px;
            background: linear-gradient(180deg, var(--copper-accent), #8c522d);
            border: 2px solid var(--slate-surface);
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(200, 127, 76, 0.6);
        }

        input[type="number"] {
            width: 50px;
            background: #111418;
            border: 1px solid var(--bronze-muted);
            color: var(--neon-amber);
            padding: 4px;
            border-radius: 4px;
            text-align: center;
            font-family: 'Courier Prime', monospace;
            font-weight: bold;
            box-shadow: var(--neo-inset);
        }

        /* Colors */
        .color-palette {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .color-btn {
            height: 30px;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            box-shadow: var(--neo-shadow);
            transition: transform 0.2s;
        }

        .color-btn.active {
            border-color: #fff;
            box-shadow: 0 0 10px currentColor, var(--neo-inset);
            transform: scale(0.9);
        }

        /* Actions */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .action-btn {
            background: var(--slate-bg);
            color: var(--text-main);
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: var(--neo-shadow);
            font-family: 'Courier Prime', monospace;
            font-size: 0.8rem;
        }
        
        .action-btn:active { box-shadow: var(--neo-inset); }

        #playAnimationBtn { color: #00ff00; }
        #pauseAnimationBtn { color: #ffb703; }
        #resetAnimationBtn { color: #ff0055; }
        
        .timeline {
            height: 10px;
            background: #111418;
            border-radius: 5px;
            box-shadow: var(--neo-inset);
            margin-top: 10px;
            position: relative;
        }
        
        .timeline-marker {
            position: absolute;
            width: 6px;
            height: 14px;
            background: var(--neon-cyan);
            top: -2px;
            border-radius: 3px;
            box-shadow: 0 0 5px var(--neon-cyan);
        }

        .back-link {
            text-align: center;
            margin-top: 10px;
        }
        .back-link a {
            color: var(--bronze-muted);
            text-decoration: none;
            font-family: 'Courier Prime', monospace;
            font-size: 0.9rem;
        }
        .back-link a:hover { color: var(--copper-accent); text-decoration: underline; }
    </style>

</head>
<body>

    <div style="width: 100%; max-width: 1400px; display: flex; flex-direction: column;">
        <h1>⚙️ Mechanische Spirograaf 3D</h1>
        
        <div class="main-container">
            
            <div class="canvas-wrapper">

            <div class="controls-wrapper">

                    </div>
                </div>

                <div class="control-section">
                    <h2>Geometrie Parameters</h2>
                    <div id="paramContainer"></div>
                </div>
                
                <div class="control-section">
                    <h2>Constellatie Type</h2>
                    <div class="btn-grid">
                        <button id="modeInside" class="neo-btn">Binnenkant (Hypo)</button>
                        <button id="modeOutside" class="neo-btn">Buitenkant (Epi)</button>
                    </div>
                </div>
                
                <div class="control-section">

                </div>

                    <h2>Mechanische Aandrijving</h2>
                    <div class="param-row">

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const NUM_FIGURES = 5;
        const MIN_ZOOM = 150;
        const MAX_ZOOM = 1000;
        const PARAMETERS = {
            R: { min: 10, max: 250, step: 1, label: 'Primaire Radius' },
            r: { min: 1, max: 250, step: 1, label: 'Secundaire Radius' },
            d: { min: 1, max: 250, step: 1, label: 'Pen Offset (d)' },
            size: { min: 0.1, max: 5, step: 0.05, label: 'Lijndikte' },
            rotation: { min: 0, max: 360, step: 1, label: 'Z-Rotatie' },
        };

        const container = document.getElementById('spiroContainer');
        const zoomSlider = document.getElementById('zoomSlider');
        const tabs = document.querySelectorAll('.tab');
        const modeInsideBtn = document.getElementById('modeInside');
        const modeOutsideBtn = document.getElementById('modeOutside');
        const styleTubeBtn = document.getElementById('styleTube');
        const styleSphereBtn = document.getElementById('styleSphere');
        const colorPalette = document.getElementById('color-palette');
        const clearBtn = document.getElementById('clearBtn');
        const addKeyframeBtn = document.getElementById('addKeyframeBtn');
        const playAnimationBtn = document.getElementById('playAnimationBtn');
        const pauseAnimationBtn = document.getElementById('pauseAnimationBtn');
        const resetAnimationBtn = document.getElementById('resetAnimationBtn');
        const timelineIndicator = document.getElementById('timeline-indicator');
        const paramContainer = document.getElementById('paramContainer');
        
        let scene, camera, renderer, controls, clock, composer, bloomPass;
        let figureGroups = [];
        const zPositions = [20, 10, 0, -10, -20];
        
        // Dark abstract background
        let backgroundScene, backgroundCam;
        let backgroundMesh;
        const shaderMaterial = new THREE.ShaderMaterial({
            uniforms: { u_time: { value: 0.0 }, u_resolution: { value: new THREE.Vector2() } },
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
            fragmentShader: `
                uniform vec2 u_resolution; uniform float u_time; varying vec2 vUv;
                float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123); }
                float noise(vec2 st) {
                    vec2 i = floor(st); vec2 f = fract(st); vec2 u = f * f * (3.0 - 2.0 * f);
                    return mix(mix(random(i + vec2(0.0, 0.0)), random(i + vec2(1.0, 0.0)), u.x),
                               mix(random(i + vec2(0.0, 1.0)), random(i + vec2(1.0, 1.0)), u.x), u.y);
                }
                float fbm(vec2 st) {
                    float value = 0.0; float amplitude = 0.5;
                    for (int i = 0; i < 5; i++) { value += amplitude * noise(st); st *= 2.0; amplitude *= 0.5; }
                    return value;
                }
                void main() {
                    vec2 st = vUv; st.x *= u_resolution.x / u_resolution.y;
                    // Dark mechanical background
                    vec3 color1 = vec3(0.05, 0.06, 0.08);
                    vec3 color2 = vec3(0.12, 0.08, 0.05); // slight copper tint
                    vec2 noise_st = st * 3.0; noise_st.y += u_time * 0.02;
                    float n = fbm(noise_st);
                    vec3 finalColor = mix(color1, color2, n * 0.5);
                    gl_FragColor = vec4(finalColor, 1.0);
                }`
        });

        let activeFigureIndex = 0;
        // Neon color palette for Steampunk contrast
        const colorList = ['#00f0ff', '#ffb703', '#ff0055', '#00ffaa', '#b08d6a', '#c87f4c', '#ff5500', '#dd00ff', '#5555ff', '#ffffff'];
        let figures = [];
        let isAnimating = false;
        let animationState = { startTime: 0, fromIndex: 0, duration: 3000 };
        const uiControls = {};

        function createInitialFigures() {
            return [
                { R: 180, r: 55, d: 125, size: 0.8, rotation: 0, color: '#00f0ff', mode: 'inside', style: 'tube', keyframes: [] },
                { R: 150, r: 65, d: 80, size: 0.5, rotation: 20, color: '#ffb703', mode: 'inside', style: 'tube', keyframes: [] },
                { R: 200, r: 110, d: 90, size: 1.5, rotation: 45, color: '#ff0055', mode: 'outside', style: 'sphere', keyframes: [] },
                { R: 120, r: 40, d: 150, size: 0.4, rotation: 90, color: '#00ffaa', mode: 'inside', style: 'tube', keyframes: [] },
                { R: 220, r: 80, d: 70, size: 1.2, rotation: 120, color: '#c87f4c', mode: 'outside', style: 'sphere', keyframes: [] }
            ];
        }

        function createResetFigures() {
            const baseFig = { R: 100, r: 10, d: 10, size: 0.5, rotation: 0, mode: 'inside', style: 'tube', keyframes: [] };
            return Array(NUM_FIGURES).fill(null).map((_, i) => ({
                ...baseFig,
                style: i % 2 === 0 ? 'sphere' : 'tube',
                size: i % 2 === 0 ? 1.5 : 0.5,
                color: colorList[i],
                keyframes: []
            }));
        }

        function init() {
            scene = new THREE.Scene();
            clock = new THREE.Clock();
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            container.appendChild(renderer.domElement);

            camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 2000);
            camera.position.set(0, 0, 500);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = false; // We handle complex rotation manually
            controls.minDistance = MIN_ZOOM;
            controls.maxDistance = MAX_ZOOM;

            const backgroundGeom = new THREE.PlaneGeometry(2, 2);
            backgroundMesh = new THREE.Mesh(backgroundGeom, shaderMaterial);
            backgroundScene = new THREE.Scene();
            backgroundCam = new THREE.Camera();
            backgroundScene.add(backgroundMesh);
            renderer.autoClear = false;

            const renderScene = new RenderPass(scene, camera);
            // Stronger bloom for intense neon steampunk effect
            bloomPass = new UnrealBloomPass(new THREE.Vector2(container.clientWidth, container.clientHeight), 2.5, 0.6, 0.1);
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            buildParameterControls();
            figures = createInitialFigures();
            populateColorPalette();
            
            for (let i = 0; i < NUM_FIGURES; i++) {
                const group = new THREE.Group();
                figureGroups.push(group);
                scene.add(group);
                updateFigure(i);
            }
            
            setActiveFigure(0);
            addEventListeners();
            animate();
        }

        function getSpirographPoints(fig) {
            const { R, r, d, mode } = fig;
            const points = [];
            if (r === 0) return points;
            const commonDivisor = gcd(Math.round(R), Math.round(r));
            const revolutions = Math.round(Math.abs(r)) / commonDivisor;
            const max_t = 2 * Math.PI * revolutions;
            for (let t = 0; t <= max_t; t += 0.02) {
                let x, y;
                if (mode === 'inside') {
                    const R_minus_r = R - r; const ratio = R_minus_r / r;
                    x = R_minus_r * Math.cos(t) + d * Math.cos(t * ratio);
                    y = R_minus_r * Math.sin(t) - d * Math.sin(t * ratio);
                } else {
                    const R_plus_r = R + r; const ratio = R_plus_r / r;
                    x = R_plus_r * Math.cos(t) - d * Math.cos(t * ratio);
                    y = R_plus_r * Math.sin(t) - d * Math.sin(t * ratio);
                }
                points.push(new THREE.Vector3(x, y, 0));
            }
            return points;
        }

        function createSpirographObject(fig) {
            const points = getSpirographPoints(fig);
            if (points.length < 2) return new THREE.Object3D();
            const material = new THREE.MeshBasicMaterial({ color: new THREE.Color(fig.color) });
            if (fig.style === 'sphere') {
                const sphereGeometry = new THREE.SphereGeometry(fig.size, 12, 8);
                const sphereGroup = new THREE.Group();
                const step = Math.max(1, Math.floor(points.length / 250));
                for (let i = 0; i < points.length; i += step) {
                    const sphereMesh = new THREE.Mesh(sphereGeometry, material);
                    sphereMesh.position.copy(points[i]);
                    sphereGroup.add(sphereMesh);
                }
                return sphereGroup;
            } else {
                const curve = new THREE.CatmullRomCurve3(points);
                const geometry = new THREE.TubeGeometry(curve, 256, fig.size, 12, false);
                return new THREE.Mesh(geometry, material);
            }
        }

        function updateFigure(index) {
            const fig = figures[index];
            const group = figureGroups[index];
            while(group.children.length > 0){ 
                const objectToRemove = group.children[0];
                objectToRemove.traverse(child => {
                    if (child.isMesh) {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) child.material.dispose();
                    }
                });
                group.remove(objectToRemove); 
            }
            const newObject = createSpirographObject(fig);
            group.add(newObject);
            // Reset base rotation for the Z-axis slider
            group.rotation.set(0, 0, fig.rotation * Math.PI / 180);
            group.position.z = zPositions[index];
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            shaderMaterial.uniforms.u_time.value += delta;
            
            if (isAnimating) {
                runAnimation();
            }

            // Complex multi-axis rotation to make it more mesmerizing
            figureGroups.forEach((group, index) => {
                // We keep the base Z rotation from the slider, but add continuous X and Y rotations
                const speed = 0.002 + (index * 0.0005);
                group.rotateX(speed);
                group.rotateY(speed * 0.8);
            });

            controls.update();
            renderer.clear();
            renderer.render(backgroundScene, backgroundCam);
            renderer.clearDepth();
            composer.render(delta);
        }

        function setActiveFigure(index) {
            pauseAnimation();
            activeFigureIndex = index;
            tabs.forEach((tab, i) => tab.classList.toggle('active', i === index));
            updateUIControls();
            updateTimelineIndicator();
        }

        function updateUIControls(sourceFigure = figures[activeFigureIndex]) {
            for (const key in PARAMETERS) {
                uiControls[key].slider.value = sourceFigure[key];
                uiControls[key].number.value = sourceFigure[key];
            }
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.color === sourceFigure.color));
            modeInsideBtn.classList.toggle('active', sourceFigure.mode === 'inside');
            modeOutsideBtn.classList.toggle('active', sourceFigure.mode === 'outside');
            styleTubeBtn.classList.toggle('active', sourceFigure.style === 'tube');
            styleSphereBtn.classList.toggle('active', sourceFigure.style === 'sphere');
            updateZoomSliderFromCamera();
        }

        function populateColorPalette() {
            colorPalette.innerHTML = '';
            colorList.forEach(color => {
                const button = document.createElement('button');
                button.className = 'color-btn';
                button.style.backgroundColor = color;
                button.style.color = color; // Used for shadow
                button.dataset.color = color;
                colorPalette.appendChild(button);
            });
            document.querySelectorAll('.color-btn').forEach(btn => btn.addEventListener('click', handleColorChange));
        }
        
        function gcd(a, b) { return b ? gcd(b, a % b) : a; }

        function handleParameterChange(param, value) {
            pauseAnimation();
            const fig = figures[activeFigureIndex];
            const pInfo = PARAMETERS[param];
            const clampedValue = Math.max(pInfo.min, Math.min(pInfo.max, value));
            
            fig[param] = clampedValue;
            uiControls[param].slider.value = clampedValue;
            uiControls[param].number.value = clampedValue;
            
            updateFigure(activeFigureIndex);
        }

        function handleModeChange(e) {
            pauseAnimation();
            figures[activeFigureIndex].mode = e.target.id === 'modeInside' ? 'inside' : 'outside';
            updateUIControls();
            updateFigure(activeFigureIndex);
        }

        function handleStyleChange(e) {
            pauseAnimation();
            const newStyle = e.target.id === 'styleSphere' ? 'sphere' : 'tube';
            const fig = figures[activeFigureIndex];
            fig.style = newStyle;
            fig.size = newStyle === 'sphere' ? 1.5 : 0.5;
            updateUIControls();
            updateFigure(activeFigureIndex);
        }
        
        function handleColorChange(e) {
            pauseAnimation();
            figures[activeFigureIndex].color = e.target.dataset.color;
            updateUIControls();
            updateFigure(activeFigureIndex);
        }

        function handleZoomSlider(e) {
            const zoomValue = parseFloat(e.target.value) / 100;
            camera.position.setLength(MIN_ZOOM + (MAX_ZOOM - MIN_ZOOM) * (1 - zoomValue));
        }

        function updateZoomSliderFromCamera() {
            const currentDistance = controls.getDistance();
            const zoomPercentage = 1 - THREE.MathUtils.clamp((currentDistance - MIN_ZOOM) / (MAX_ZOOM - MIN_ZOOM), 0, 1);
            zoomSlider.value = zoomPercentage * 100;
        }

        function handleResize() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            renderer.setSize(width, height);
            composer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            shaderMaterial.uniforms.u_resolution.value.set(width, height);
            if (bloomPass) bloomPass.resolution.set(width, height);
        }

        function buildParameterControls() {
            paramContainer.innerHTML = '';
            for (const key in PARAMETERS) {
                const p = PARAMETERS[key];
                const row = document.createElement('div');
                row.className = 'param-row';
                row.innerHTML = `
                    <div class="param-label">${p.label}</div>
                    <input type="range" id="${key}_slider" min="${p.min}" max="${p.max}" step="${p.step}">
                    <input type="number" id="${key}_num" min="${p.min}" max="${p.max}" step="${p.step}">
                `;
                paramContainer.appendChild(row);
                uiControls[key] = {
                    slider: document.getElementById(`${key}_slider`),
                    number: document.getElementById(`${key}_num`),
                };
            }
        }

        function addKeyframe() {
            const fig = figures[activeFigureIndex];
            const newKeyframe = { ...fig };
            delete newKeyframe.keyframes;
            fig.keyframes.push(newKeyframe);
            updateTimelineIndicator();
        }

        function playAnimation() {
            const fig = figures[activeFigureIndex];
            if (fig.keyframes.length < 2) return;
            isAnimating = true;
            animationState.startTime = clock.getElapsedTime();
            animationState.fromIndex = 0;
        }

        function pauseAnimation() { isAnimating = false; }

        function resetAnimation() {
            pauseAnimation();
            const fig = figures[activeFigureIndex];
            fig.keyframes = [];
            updateTimelineIndicator();
        }

        function runAnimation() {
            const fig = figures[activeFigureIndex];
            const kfs = fig.keyframes;
            if (kfs.length < 2) { pauseAnimation(); return; }

            const elapsedTime = (clock.getElapsedTime() - animationState.startTime) * 1000;
            const progress = (elapsedTime % animationState.duration) / animationState.duration;
            
            const totalCycles = Math.floor(elapsedTime / animationState.duration);
            const fromIndex = totalCycles % (kfs.length -1);
            const toIndex = (fromIndex + 1);

            const fromFrame = kfs[fromIndex];
            const toFrame = kfs[toIndex];

            const animatedParams = { ...fig };
            for (const key in PARAMETERS) {
                animatedParams[key] = THREE.MathUtils.lerp(fromFrame[key], toFrame[key], progress);
            }
            
            Object.assign(figures[activeFigureIndex], animatedParams);
            updateUIControls(animatedParams);
            updateFigure(activeFigureIndex);
        }

        function updateTimelineIndicator() {
            timelineIndicator.innerHTML = '';
            const kfs = figures[activeFigureIndex].keyframes;
            if (kfs.length > 1) {
                for (let i = 0; i < kfs.length; i++) {
                    const marker = document.createElement('div');
                    marker.className = 'timeline-marker';
                    marker.style.left = `${(i / (kfs.length - 1)) * 100}%`;
                    timelineIndicator.appendChild(marker);
                }
            }
        }

        function addEventListeners() {
            for (const key in uiControls) {
                uiControls[key].slider.addEventListener('input', (e) => handleParameterChange(key, parseFloat(e.target.value)));
                uiControls[key].number.addEventListener('input', (e) => handleParameterChange(key, parseFloat(e.target.value)));
            }
            tabs.forEach(tab => tab.addEventListener('click', () => setActiveFigure(parseInt(tab.dataset.index))));
            [modeInsideBtn, modeOutsideBtn].forEach(btn => btn.addEventListener('click', handleModeChange));
            [styleTubeBtn, styleSphereBtn].forEach(btn => btn.addEventListener('click', handleStyleChange));
            clearBtn.addEventListener('click', () => {
                figures = createResetFigures();
                for(let i = 0; i < NUM_FIGURES; i++) { updateFigure(i); }
                setActiveFigure(0);
            });
            zoomSlider.addEventListener('input', handleZoomSlider);
            controls.addEventListener('change', updateZoomSliderFromCamera);
            addKeyframeBtn.addEventListener('click', addKeyframe);
            playAnimationBtn.addEventListener('click', playAnimation);
            pauseAnimationBtn.addEventListener('click', pauseAnimation);
            resetAnimationBtn.addEventListener('click', resetAnimation);
            window.addEventListener('resize', handleResize);
            handleResize();
            updateZoomSliderFromCamera();
        }

        init();
    </script>
</body>
</html>
