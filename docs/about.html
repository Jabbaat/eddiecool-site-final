    <h1>ℹ️ Over Eddiecool</h1>
    <p>Bekijk hier de video over Eddiecool:</p>

    <div class="single-project">
      <img src="images/video-thumbnail.jpg" alt="Eddiecool Introductie Miniatuur" class="video-poster" id="about-video-thumbnail">
      <button class="custom-play-button" id="about-custom-play">&#9658;</button>
      <video id="about-video-player" controls>
        <source src="video/eddiecool_intro.mp4" type="video/mp4">
        Je browser ondersteunt de videotag niet.
      </video>
    </div>

    <script>
        // Hamburger menu
        document.getElementById("hamburger-menu").addEventListener("click", function() {
            document.querySelector(".menu").classList.toggle("active");
        });

        // JAVASCRIPT VOOR DE VIDEO OP DE ABOUT PAGINA
        document.addEventListener('DOMContentLoaded', function() {
            const playBtnAbout = document.getElementById("about-custom-play");
            const thumbnailAbout = document.getElementById("about-video-thumbnail");
            const videoAbout = document.getElementById("about-video-player");

            if (playBtnAbout && thumbnailAbout && videoAbout) {
                playBtnAbout.addEventListener("click", function () {
                    thumbnailAbout.style.display = "none";
                    playBtnAbout.style.display = "none";
                    videoAbout.style.display = "block";
                    videoAbout.play();
                });

                thumbnailAbout.addEventListener("click", function () {
                    thumbnailAbout.style.display = "none";
                    playBtnAbout.style.display = "none";
                    videoAbout.style.display = "block";
                    videoAbout.play();
                });
            }
        });
    </script>
