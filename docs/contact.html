    <main>
        <h1>📧 Neem contact op</h1>
        <p>Bereik Eddiecool via rooksignalen, postduiven, of gewoon een e-mail.</p>

        <form action="https://formspree.io/f/mjkwkwgq" method="POST" class="neo-form">
            <label for="name">Naam:</label>
            <input class="neo-input" type="text" id="name" name="name" placeholder="Jouw naam" required>

            <label for="email">E-mail:</label>
            <input class="neo-input" type="email" id="email" name="email" placeholder="jouw@email.nl" required>

            <label for="message">Bericht:</label>
            <textarea class="neo-input" id="message" name="message" rows="5" placeholder="Schrijf je bericht..." required></textarea>

            <button type="submit" style="width:100%; padding:14px; font-size:1rem; font-weight:700; cursor:pointer; border-radius:12px;">✉️ Verstuur Bericht</button>
        </form>
    </main>
